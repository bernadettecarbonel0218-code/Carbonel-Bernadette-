
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Whispering Lotus - An elegant flower boutique.">
    <title>Whispering Lotus </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
    href="style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">

            <a href="#" class="logo">
                <img src="logo.png" alt="Whispering Lotus">
            </a>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Bouquets</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>

        </nav>
    </header>
    <main>
        <section class="hero">

            <div class="hero-content">

                <p class="eyebrow">FLOWER BOUTIQUE</p>

                <h1>
                    Whispering
                    <span>Lotus</span>
                </h1>

                <p class="tagline">
                    Where Every Flower Tells a Story
                </p>

                <p class="description">
                    Thoughtfully arranged flowers for meaningful moments,
                    heartfelt gestures, and beautiful celebrations.
                </p>

                <a href="#" class="main-button">
                    Discover Our Flowers
                </a>
            </div>
            <div class="hero-image">
                <img src="front.png" alt="Beautiful flower arrangement">
            </div>
        </section>
    </main>
</body>
</html>
